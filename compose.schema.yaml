services:
  schema-mysql:
    image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    environment:
      MYSQL_DATABASE: shopping-cart
      MYSQL_USER: schema_test
      MYSQL_PASSWORD: ${SCHEMA_TEST_MYSQL_PASSWORD:?SCHEMA_TEST_MYSQL_PASSWORD must be set at runtime}
      MYSQL_ROOT_PASSWORD: ${SCHEMA_TEST_MYSQL_PASSWORD:?SCHEMA_TEST_MYSQL_PASSWORD must be set at runtime}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_bin
      - --default-time-zone=+00:00
      - --sql-mode=STRICT_ALL_TABLES,NO_ENGINE_SUBSTITUTION,NO_AUTO_VALUE_ON_ZERO
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u schema_test -p"$${MYSQL_PASSWORD}" --silent
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    volumes:
      - schema-mysql-data:/var/lib/mysql

volumes:
  schema-mysql-data:
